  <style>
html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  background: #1a110b;
  overflow: hidden;
  overscroll-behavior: none;
  touch-action: manipulation;
  -webkit-user-select: none;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
}

body {
  display: flex;
  align-items: center;
  justify-content: center;
}

/* اللعبة بتكبر وتصغر مع حجم الشاشة وبتحافظ على النسبة 16:9 */
#game {
  display: block;
  width: min(100vw, calc(100vh * 16 / 9));
  aspect-ratio: 16 / 9;
  height: auto;
  background: #2b1d14;
}

/* رسالة لف الموبايل بالعرض */
#rotate {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 50;
  padding: 24px;
  box-sizing: border-box;
  align-items: center;
  justify-content: center;
  text-align: center;
  background: #150c07;
  color: #f2b134;
  font: 700 22px Cairo, Arial, sans-serif;
}

@media (orientation: portrait) and (max-width: 900px) {
  #rotate {
    display: flex;
  }
}

</style>
</head>

  <script>
// ===== sound.js: الأصوات (بتتعمل بالكود، مفيش ملفات صوت) =====

let audioCtx = null;
let masterGain = null;
let musicGain = null;
let sizzleGain = null;
let noiseBuffer = null;
const audioSettings = { sfx: true, music: true, sfxVol: 0.8, musicVol: 0.6 };

// لازم تتنادى بعد أول ضغطة (المتصفح مبيسمحش بصوت قبل كده)
function initAudio() {
  if (audioCtx !== null) {
    return;
  }
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) {
    return;
  }
  audioCtx = new AC();
  masterGain = audioCtx.createGain();
  masterGain.gain.value = 0.6 * audioSettings.sfxVol;
  masterGain.connect(audioCtx.destination);
  musicGain = audioCtx.createGain();
  musicGain.gain.value = audioSettings.music ? 0.1 * audioSettings.musicVol : 0;
  musicGain.connect(audioCtx.destination);

  // ضوضاء بيضا بنستخدمها لصوت التشويح والصوص
  const len = audioCtx.sampleRate * 2;
  noiseBuffer = audioCtx.createBuffer(1, len, audioCtx.sampleRate);
  const data = noiseBuffer.getChannelData(0);
  for (let i = 0; i < len; i++) {
    data[i] = Math.random() * 2 - 1;
  }

  // صوت تشويح مستمر بنتحكم في علوه
  const src = audioCtx.createBufferSource();
  src.buffer = noiseBuffer;
  src.loop = true;
  const filter = audioCtx.createBiquadFilter();
  filter.type = "bandpass";
  filter.frequency.value = 4500;
  filter.Q.value = 0.8;
  sizzleGain = audioCtx.createGain();
  sizzleGain.gain.value = 0;
  src.connect(filter);
  filter.connect(sizzleGain);
  sizzleGain.connect(masterGain);
  src.start();

  startMusic();
}

function tone(freq, delay, dur, type, vol, dest) {
  const t = audioCtx.currentTime + delay;
  const osc = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  osc.type = type;
  osc.frequency.setValueAtTime(freq, t);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(vol, t + 0.01);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  osc.connect(g);
  g.connect(dest || masterGain);
  osc.start(t);
  osc.stop(t + dur + 0.05);
}

function noiseBurst(delay, dur, freq, vol) {
  const t = audioCtx.currentTime + delay;
  const src = audioCtx.createBufferSource();
  src.buffer = noiseBuffer;
  const filter = audioCtx.createBiquadFilter();
  filter.type = "bandpass";
  filter.frequency.value = freq;
  const g = audioCtx.createGain();
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(vol, t + 0.02);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  src.connect(filter);
  filter.connect(g);
  g.connect(masterGain);
  src.start(t);
  src.stop(t + dur + 0.05);
}

const SFX = {
  click: function () { tone(660, 0, 0.06, "square", 0.12); },
  pop: function () { tone(420, 0, 0.08, "sine", 0.3); tone(630, 0.05, 0.08, "sine", 0.25); },
  bell: function () { tone(1320, 0, 0.6, "sine", 0.25); tone(1760, 0.06, 0.6, "sine", 0.18); },
  squirt: function () { noiseBurst(0, 0.7, 1500, 0.35); },
  freezer: function () { noiseBurst(0, 0.4, 350, 0.5); tone(110, 0, 0.3, "sine", 0.3); },

  <script>

// ---------- أدوات رسم عامة ----------

function roundRectPath(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function fillRound(x, y, w, h, r, fill) {
  roundRectPath(x, y, w, h, r);
  ctx.fillStyle = fill;
  ctx.fill();
}

function vGradient(y1, y2, c1, c2) {
  const g = ctx.createLinearGradient(0, y1, 0, y2);
  g.addColorStop(0, c1);
  g.addColorStop(1, c2);
  return g;
}

function withShadow(blur, offsetY, color, drawFn) {
  ctx.save();
  ctx.shadowColor = color;
  ctx.shadowBlur = blur;
  ctx.shadowOffsetY = offsetY;
  drawFn();
  ctx.restore();
}

function drawText(text, x, y, size, color, align) {
  // الكلام العربي بيتكتب من اليمين لليسار (عشان الأرقام وEGP تتظبط صح)
  ctx.direction = /[\u0600-\u06FF]/.test(text) ? "rtl" : "ltr";

function drawEllipse(cx, cy, rx, ry, fill) {
  ctx.fillStyle = fill;

function drawButton(box, label, color, textColor, hovered, size) {
  const fs = size || 22;
  if (hovered) {
    box = { x: box.x - 2, y: box.y - 3, w: box.w + 4, h: box.h + 4 };
  }

    fillRound(box.x, box.y, box.w, box.h, r, color);

  const g = ctx.createLinearGradient(0, box.y, 0, box.y + box.h);
  g.addColorStop(0, "rgba(255,255,255,0.28)");
  g.addColorStop(0.5, "rgba(255,255,255,0.04)");

  ctx.fillStyle = g;

// بيرسم كل الأزرار اللي ليها label في المشهد الحالي
function drawHotspotButtons() {

function drawHud() {
  ctx.fillStyle = vGradient(0, 64, "#2b1d14", "#1a110b");

  drawText("اليوم " + game.day + "  -  " + clockText(), 640, 34, 20, "#fff3df");

// ---------- البرجر والطبق ----------

function drawPlate(cx, cy, rx) {

function pattyColors(doneness) {

  if (doneness === "burnt") {

function layerHeight(L, i, scale) {
  if (L.type === "bun") {
    return (i === 0 ? 32 : 58) * scale;

  if (L.type === "sauce") {
    return 12 * scale;
  }
  if (L.type === "cheese") {
    return 9 * scale;
  }
  return 28 * scale;
}

// ارتفاع قمة البرجر (بنستخدمه عشان نعرف الصوص ينزل فين)
function burgerTopY(layers, baseY, scale) {
  let y = baseY;
  for (let i = 0; i < layers.length; i++) {
    y = y - layerHeight(layers[i], i, scale) + 3 * scale;
  }
  return y;
}

// بيرسم البرجر من تحت لفوق حسب الطبقات
function outlineLayer(scale) {
  ctx.strokeStyle = "rgba(58,33,18,0.7)";
  ctx.lineWidth = Math.max(1.2, 2 * scale);
  ctx.stroke();
}

// بيرسم البرجر من تحت لفوق حسب الطبقات (بخطوط خارجية زي اللوجو)
function drawBurger(cx, baseY, layers, scale) {
  let y = baseY;
  const w = 170 * scale;

  for (let i = 0; i < layers.length; i++) {
    const L = layers[i];
    const h = layerHeight(L, i, scale);
    y = y - h;

    if (L.type === "bun" && i === 0) {
      fillRound(cx - w / 2, y, w, h, 16 * scale, vGradient(y, y + h, "#e0953f", "#b8691f"));
      outlineLayer(scale);
    } else if (L.type === "bun") {
      ctx.beginPath();
      ctx.moveTo(cx - w / 2, y + h);
      ctx.bezierCurveTo(cx - w / 2, y - h * 0.35, cx + w / 2, y - h * 0.35, cx + w / 2, y + h);
      ctx.closePath();
      ctx.fillStyle = vGradient(y, y + h, "#f0a94d", "#c97a30");
      ctx.fill();
      outlineLayer(scale);
      fillRound(cx - w * 0.3, y + h * 0.12, w * 0.3, h * 0.12, h * 0.06, "rgba(255,255,255,0.3)");
      const seeds = [[-0.22, 0.45], [0, 0.25], [0.22, 0.45], [-0.1, 0.62], [0.12, 0.62]];
      for (let k = 0; k < seeds.length; k++) {
        drawEllipse(cx + w * seeds[k][0], y + h * seeds[k][1], 5 * scale, 2.6 * scale, "#fff3df");
      }
    } else if (L.type === "sauce") {
      fillRound(cx - w * 0.46, y, w * 0.92, h, 6 * scale, L.color || "#d62f2a");
      outlineLayer(scale);
      fillRound(cx - w * 0.4, y + 2 * scale, w * 0.8, 3 * scale, 2, "rgba(255,255,255,0.35)");
    } else if (L.type === "cheese") {
      fillRound(cx - w * 0.52, y, w * 1.04, h, 3 * scale, "#f2c230");
      outlineLayer(scale);
      ctx.fillStyle = "#f2c230";
      ctx.beginPath();
      ctx.moveTo(cx - w * 0.3, y + h);
      ctx.lineTo(cx - w * 0.2, y + h + 9 * scale);
      ctx.lineTo(cx - w * 0.1, y + h);

          ctx.lineTo(cx + k * 22 * scale + 6 * scale, y + h - 6 * scale);
        }
        ctx.stroke();
      }

    y = y + 3 * scale;

  return y;
}

// ---------- بطاطس ومشروبات وصينية ----------

function drawFries(cx, baseY, scale, doneness) {

  ctx.moveTo(cx - 28 * scale, baseY - 34 * scale);
  ctx.lineTo(cx + 28 * scale, baseY - 34 * scale);
  ctx.lineTo(cx + 22 * scale, baseY);
  ctx.lineTo(cx - 22 * scale, baseY);
  ctx.closePath();
  ctx.fillStyle = "#d62f2a";
  ctx.fill();
  fillRound(cx - 22 * scale, baseY - 22 * scale, 44 * scale, 10 * scale, 2, "#fff3df");
}

function drawCup(cx, baseY, scale, drink, fill) {
  const s = scale;
  const f = fill === undefined ? 1 : fill;
  const liquid = drink === "cola" ? "#4a2615" : "#f08a1c";
  if (f >= 1) {
    ctx.strokeStyle = "#fff3df";
    ctx.lineWidth = 3 * s;
    ctx.lineCap = "round";
    ctx.beginPath();
    ctx.moveTo(cx + 6 * s, baseY - 66 * s);
    ctx.lineTo(cx + 12 * s, baseY - 92 * s);
    ctx.stroke();
  }
  ctx.beginPath();
  ctx.moveTo(cx - 22 * s, baseY - 62 * s);
  ctx.lineTo(cx + 22 * s, baseY - 62 * s);
  ctx.lineTo(cx + 16 * s, baseY);
  ctx.lineTo(cx - 16 * s, baseY);
  ctx.closePath();
  ctx.fillStyle = "#fff3df";
  ctx.fill();
  ctx.strokeStyle = "rgba(58,33,18,0.65)";
  ctx.lineWidth = Math.max(1.2, 2 * s);
  ctx.stroke();
  if (drink && f > 0) {
    const h = 46 * s * f;
    const hw = 16 * s + 6 * s * (h / (62 * s));
    ctx.beginPath();
    ctx.moveTo(cx - hw, baseY - h);
    ctx.lineTo(cx + hw, baseY - h);
    ctx.lineTo(cx + 16 * s, baseY);
    ctx.lineTo(cx - 16 * s, baseY);
    ctx.closePath();
    ctx.fillStyle = liquid;
    ctx.fill();
  }
  if (f >= 1) {
    fillRound(cx - 25 * s, baseY - 70 * s, 50 * s, 9 * s, 4 * s, "#d62f2a");

function drawTrayItems(tray, cx, baseY, scale) {
  let burgers = 0;
  for (let i = 0; i < tray.length; i++) {
    if (tray[i].kind === "burger") {
      burgers = burgers + 1;
    }
  }
  let b = 0;
  let f = 0;
  let d = 0;
  for (let i = 0; i < tray.length; i++) {
    const t = tray[i];
    if (t.kind === "burger") {
      drawBurger(cx + (b - (burgers - 1) / 2) * 90 * scale, baseY, t.layers, scale);
      b = b + 1;
    } else if (t.kind === "fries") {
      drawFries(cx - 125 * scale - f * 34 * scale, baseY, scale * 1.3, t.doneness);
      f = f + 1;
    } else {
      drawCup(cx + 125 * scale + d * 34 * scale, baseY, scale * 1.3, t.drink);
      d = d + 1;
    }
  }
}

// ---------- نجمة ومقفول وزبون بياكل ----------

function drawStar(cx, cy, r, color) {
  ctx.beginPath();
  for (let i = 0; i < 10; i++) {
    const ang = -Math.PI / 2 + (i * Math.PI) / 5;
    const rad = i % 2 === 0 ? r : r * 0.45;
    const x = cx + Math.cos(ang) * rad;
    const y = cy + Math.sin(ang) * rad;
    if (i === 0) {
      ctx.moveTo(x, y);
    } else {
      ctx.lineTo(x, y);
    }
  }
  ctx.closePath();
  ctx.fillStyle = color;
  ctx.fill();
}

// 5 نجوم، المملية بالدهبي والباقي رمادي
function drawStars(cx, cy, r, filled) {
  for (let i = 0; i < 5; i++) {
    drawStar(cx + (i - 2) * r * 2.3, cy, r, i < filled ? "#f2b134" : "#5a6a74");
  }
}

function drawLockOverlay(x, y, w, h, r, label) {
  fillRound(x, y, w, h, r, "rgba(20,14,10,0.8)");
  const cx = x + w / 2;
  const cy = y + h / 2 - 8;
  ctx.strokeStyle = "#f2b134";
  ctx.lineWidth = 4;
  ctx.beginPath();
  ctx.arc(cx, cy - 6, 8, Math.PI, Math.PI * 2);
  ctx.stroke();
  fillRound(cx - 12, cy - 6, 24, 18, 4, "#f2b134");
  drawText(label, cx, cy + 34, 15, "#fff3df");
}

// زبون صغير قاعد على ترابيزة وبياكل

// ---------- لمسات الجرافيكس ----------

function strokeRound(x, y, w, h, r, color, lw) {
  roundRectPath(x, y, w, h, r);
  ctx.strokeStyle = color;
  ctx.lineWidth = lw;
  ctx.stroke();
}

// الزبون بيدخل من الشمال وبيتنفس وهو واقف

// ضلال خفيفة على أطراف الشاشة
function drawVignette(fromY) {
  if (settings.quality === "low") {
    return;
  }
  const y0 = fromY === undefined ? 64 : fromY;
  const g = ctx.createRadialGradient(640, 380, 380, 640, 380, 820);
  g.addColorStop(0, "rgba(0,0,0,0)");
  g.addColorStop(1, "rgba(10,5,2,0.45)");
  ctx.fillStyle = g;
  ctx.fillRect(0, y0, 1280, 720 - y0);
}

// بخار طالع من الأكل
function drawSteam(x, y, strength) {
  if (settings.quality === "low") {
    return;
  }
  for (let k = 0; k < 4; k++) {
    const phase = (game.time * 0.8 + k * 0.25) % 1;
    const px = x + Math.sin(phase * 6 + k * 2) * 8;
    const py = y - phase * 60;
    const r = 6 + phase * 12;
    drawEllipse(px, py, r, r, "rgba(255,255,255," + ((1 - phase) * 0.35 * strength).toFixed(3) + ")");
  }
}

// ---------- أدوات جرافيكس مشتركة (الجيل التاني) ----------

// مستطيل مدور بخط خارجي
function outlinedRound(x, y, w, h, r, fill, lw, stroke) {
  roundRectPath(x, y, w, h, r);
  ctx.fillStyle = fill;
  ctx.fill();
  ctx.strokeStyle = stroke || "rgba(40,22,12,0.75)";
  ctx.lineWidth = lw || 3;
  ctx.stroke();
}

// تدريج ستانلس ستيل
function metalGradient(y1, y2) {
  const g = ctx.createLinearGradient(0, y1, 0, y2);
  g.addColorStop(0, "#eef2f5");
  g.addColorStop(0.35, "#c3cad0");
  g.addColorStop(0.7, "#9aa3ab");
  g.addColorStop(1, "#7d868e");
  return g;
}

// لمعة فوق الشكل
function drawGloss(x, y, w, h, r) {
  fillRound(x + 3, y + 3, w - 6, h * 0.42, r, "rgba(255,255,255,0.22)");
}

function drawBolt(x, y) {
  drawEllipse(x, y, 3.5, 3.5, "#6b7580");
  drawEllipse(x - 1, y - 1, 1.2, 1.2, "rgba(255,255,255,0.7)");
}

// بيقسم الكلام لسطور على قد العرض
function wrapText(text, maxW, size) {
  ctx.font = "bold " + size + "px " + FONT;
  const words = text.split(" ");
  const lines = [];
  let cur = "";
  for (let i = 0; i < words.length; i++) {
    const test = cur ? cur + " " + words[i] : words[i];
    if (ctx.measureText(test).width > maxW && cur) {
      lines.push(cur);
      cur = words[i];
    } else {
      cur = test;
    }
  }
  if (cur) {
    lines.push(cur);
  }
  return lines;
}

// ---------- مستوى اللاعب وأرقام طايرة وقصاصات ----------

function drawLevelPill() {
  if (game.tut) {
    fillRound(290, 16, 130, 32, 16, "#5aa335");
    drawText("وضع التدريب", 355, 38, 16, "#10260a");
    return;
  }
  fillRound(196, 16, 80, 32, 16, "rgba(242,177,52,0.18)");
  strokeRound(196, 16, 80, 32, 16, "rgba(242,177,52,0.6)", 2);
  drawText("Lv " + game.level, 236, 36, 16, "#f2b134");
  const prev = levelStartXp(game.level);
  const next = levelStartXp(game.level + 1);
  const frac = Math.min(1, Math.max(0, (game.xp - prev) / (next - prev)));
  fillRound(206, 41, 60, 4, 2, "rgba(0,0,0,0.5)");
  fillRound(206, 41, Math.max(3, 60 * frac), 4, 2, "#f2b134");
}

function addFloat(text, x, y, color, size) {
  game.floatTexts.push({ text: text, x: x, y: y, color: color || "#8fdc5a", size: size || 22, t: 0 });
}

function drawFloatTexts() {
  for (let i = 0; i < game.floatTexts.length; i++) {
    const f = game.floatTexts[i];
    ctx.globalAlpha = Math.max(0, 1 - f.t / 1.8);
    withShadow(6, 2, "rgba(0,0,0,0.6)", function () {
      drawText(f.text, f.x, f.y - f.t * 46, f.size, f.color);
    });
    ctx.globalAlpha = 1;
  }
}

function addConfetti(n) {
  const cols = ["#f2b134", "#d62f2a", "#5aa335", "#3d6fbf", "#ff7eb6", "#fff3df"];
  for (let i = 0; i < n; i++) {
    game.confetti.push({
      x: 640 + (Math.random() - 0.5) * 300, y: 300, vx: (Math.random() - 0.5) * 520, vy: -200 - Math.random() * 380,
      r: Math.random() * 6, vr: (Math.random() - 0.5) * 12, c: cols[i % cols.length], t: 0
    });
  }
}

function drawConfetti() {
  for (let i = 0; i < game.confetti.length; i++) {
    const p = game.confetti[i];
    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.rotate(p.r);
    ctx.globalAlpha = Math.max(0, 1 - p.t / 2.6);
    ctx.fillStyle = p.c;
    ctx.fillRect(-5, -3, 10, 6);
    ctx.restore();
  }
  ctx.globalAlpha = 1;
}

  drawEllipse(640, faceCy, faceRx, faceRy, skin);
  ctx.strokeStyle = line;
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.ellipse(640, faceCy, faceRx, faceRy, 0, 0, Math.PI * 2);
  ctx.stroke();

  // ---- الشعر قدام ----
  ctx.fillStyle = look.hair;
  if (style === "short" || style === "long" || style === "pigtails") {
    ctx.beginPath();
    ctx.ellipse(640, 262, 66, 46, 0, Math.PI, Math.PI * 2);
    ctx.fill();
    if (style === "pigtails") {
      fillRound(570, 296, 10, 8, 3, "#ff4f8a");
      fillRound(700, 296, 10, 8, 3, "#ff4f8a");
    }
  } else if (style === "slick") {
    ctx.beginPath();
    ctx.ellipse(640, 258, 66, 40, 0, Math.PI, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = "rgba(255,255,255,0.35)";
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.arc(640, 262, 52, Math.PI * 1.15, Math.PI * 1.7);
    ctx.stroke();
  } else if (style === "afro") {
    ctx.beginPath();
    ctx.ellipse(640, 256, 70, 34, 0, Math.PI, Math.PI * 2);
    ctx.fill();
  } else if (style === "cap") {
    ctx.fillStyle = look.capColor;
    ctx.beginPath();
    ctx.ellipse(640, 258, 68, 44, 0, Math.PI, Math.PI * 2);
    ctx.fill();
    fillRound(590, 252, 120, 12, 6, look.capColor);
    fillRound(650, 256, 80, 10, 5, "#444");
    drawEllipse(640, 238, 8, 8, "#f2b134");
  } else if (style === "mohawk") {
    ctx.beginPath();
    for (let k = 0; k < 5; k++) {
      const bx = 612 + k * 14;
      ctx.moveTo(bx - 8, 236);
      ctx.lineTo(bx, 190 - (k % 2) * 14);
      ctx.lineTo(bx + 8, 236);
    }
    ctx.fill();
    ctx.beginPath();
    ctx.ellipse(640, 252, 18, 12, 0, Math.PI, Math.PI * 2);
    ctx.fill();
  } else if (style === "messy") {
    ctx.beginPath();
    ctx.ellipse(640, 262, 66, 44, 0, Math.PI, Math.PI * 2);
    ctx.fill();
    for (let k = 0; k < 5; k++) {
      drawEllipse(600 + k * 20, 226 - (k % 2) * 8, 14, 14, look.hair);
    }
  } else if (style === "spiky") {
    ctx.beginPath();
    for (let k = 0; k < 6; k++) {
      const bx = 596 + k * 17;
      ctx.moveTo(bx - 9, 240);
      ctx.lineTo(bx, 200 - (k % 2) * 12);
      ctx.lineTo(bx + 9, 240);
    }
    ctx.fill();
    ctx.beginPath();
    ctx.ellipse(640, 258, 64, 38, 0, Math.PI, Math.PI * 2);
    ctx.fill();
  } else if (style === "chef") {
    drawEllipse(584, 270, 12, 20, look.hair);
    drawEllipse(696, 270, 12, 20, look.hair);
    ctx.fillStyle = "#fffaf0";
    ctx.strokeStyle = "rgba(58,33,18,0.6)";
    ctx.lineWidth = 3;
    const puffs = [[598, 190, 30, 28], [640, 172, 34, 32], [682, 190, 30, 28]];
    for (let k = 0; k < puffs.length; k++) {
      ctx.beginPath();
      ctx.ellipse(puffs[k][0], puffs[k][1], puffs[k][2], puffs[k][3], 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();
    }
    outlinedRound(588, 200, 104, 44, 10, "#fffaf0", 3);
    outlinedRound(582, 236, 116, 16, 6, "#f2f2f2", 3);
  } else if (style === "bald") {
    drawEllipse(580, 290, 10, 24, look.hair);
    drawEllipse(700, 290, 10, 24, look.hair);
    drawEllipse(622, 246, 18, 7, "rgba(255,255,255,0.3)");
  } else if (hijab) {
    ctx.fillStyle = look.scarf[0];
    ctx.beginPath();
    ctx.ellipse(640, 264, 64, 36, 0, Math.PI, Math.PI * 2);
    ctx.fill();
    drawEllipse(640, 366, 48, 14, look.scarf[0]);
  }

  // دقن
  if (look.beard) {
    ctx.fillStyle = look.hair;
    ctx.beginPath();
    ctx.ellipse(640, 330, 60, 46, 0, 0, Math.PI);
    ctx.fill();
  }

  // تجاعيد
  if (look.wrinkles) {
    ctx.strokeStyle = "rgba(0,0,0,0.2)";
    ctx.lineWidth = 2;
    ctx.beginPath();
    if (!hijab) {
      ctx.moveTo(612, 260); ctx.lineTo(668, 260);
      ctx.moveTo(618, 269); ctx.lineTo(662, 269);
    }
    ctx.moveTo(594, 298); ctx.lineTo(586, 294);
    ctx.moveTo(594, 303); ctx.lineTo(586, 306);
    ctx.moveTo(686, 298); ctx.lineTo(694, 294);
    ctx.moveTo(686, 303); ctx.lineTo(694, 306);
    ctx.stroke();
  }

  // العيون
  const blink = game.time % 4 < 0.12 ? 0.15 : 1;
  const big = look.kid ? 1.25 : 1;
  if (look.sunglasses) {
    fillRound(592, 288, 40, 24, 8, "#111");
    fillRound(648, 288, 40, 24, 8, "#111");
    fillRound(630, 296, 20, 5, 2, "#111");
    fillRound(598, 291, 14, 5, 2, "rgba(255,255,255,0.35)");
    fillRound(654, 291, 14, 5, 2, "rgba(255,255,255,0.35)");
  } else {
    drawEllipse(615, 300, 10 * big, 8 * big * blink, "#ffffff");
    drawEllipse(665, 300, 10 * big, 8 * big * blink, "#ffffff");
    drawEllipse(615, 301, 4.5 * big, 4.5 * big * blink, "#2b1a12");
    drawEllipse(665, 301, 4.5 * big, 4.5 * big * blink, "#2b1a12");
    drawEllipse(617, 299, 1.6, 1.6 * blink, "#ffffff");
    drawEllipse(667, 299, 1.6, 1.6 * blink, "#ffffff");
  }
  if (look.glasses) {
    const gr = look.bigGlasses ? 19 : 15;
    ctx.strokeStyle = "#2b1d14";
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.arc(615, 300, gr, 0, Math.PI * 2);
    ctx.moveTo(665 + gr, 300);
    ctx.arc(665, 300, gr, 0, Math.PI * 2);
    ctx.moveTo(615 + gr, 300); ctx.lineTo(665 - gr, 300);
    ctx.stroke();
  }

  // مناخير
  ctx.strokeStyle = "rgba(0,0,0,0.22)";
  ctx.lineWidth = 3;
  ctx.lineCap = "round";
  ctx.beginPath();
  ctx.moveTo(640, 306); ctx.lineTo(635, 320); ctx.lineTo(645, 320);
  ctx.stroke();

  if (look.blush) {
    drawEllipse(596, 326, 11, 7, "rgba(255,90,110,0.35)");
    drawEllipse(684, 326, 11, 7, "rgba(255,90,110,0.35)");
  }

  // الحواجب حسب مزاج الزبون
  if (!look.sunglasses) {
    ctx.strokeStyle = look.brow || look.hair;
    ctx.lineWidth = 4;
    ctx.beginPath();
    if (ratio > 0.25) {
      ctx.moveTo(601, 281); ctx.lineTo(629, 281);
      ctx.moveTo(651, 281); ctx.lineTo(679, 281);
    } else {
      ctx.moveTo(601, 274); ctx.lineTo(629, 286);
      ctx.moveTo(679, 274); ctx.lineTo(651, 286);
    }
    ctx.stroke();
  }

  if (look.mustache) {
    fillRound(614, 311, 52, 10, 5, look.mustache);
  }

  // الفم حسب المزاج (وبيتحرك لما الزبون بيتكلم)
  ctx.strokeStyle = look.mouth || "#7a2f22";
  ctx.lineWidth = 4;
  ctx.beginPath();
  if (talking) {
    const open = 4 + Math.abs(Math.sin(game.time * 14)) * 7;
    drawEllipse(640, 336, 11, open, "#5a1f18");
    ctx.beginPath();
  } else if (ratio > 0.5) {
    ctx.arc(640, 322, 16, 0.15 * Math.PI, 0.85 * Math.PI);
  } else if (ratio > 0.25) {
    ctx.moveTo(626, 334); ctx.lineTo(654, 334);
  } else {
    ctx.arc(640, 346, 16, 1.15 * Math.PI, 1.85 * Math.PI);
  }
  ctx.stroke();
}

// ---------- فقاعة الكلام ----------

function drawBubble(c, ratio) {
  const W = 360;
  const cx = 640;
  let lines = [];
  let shown = [];
  let size = 17;
  let lh = 22;
  let header = c.look.name;

  if (c.state === "ordering") {
    const d = c.dlg;
    lines = wrapText(d.lines[d.idx], W - 40, size);
    let remaining = Math.floor(d.t * 32);
    for (let i = 0; i < lines.length; i++) {
      shown.push(lines[i].slice(0, Math.max(0, Math.min(lines[i].length, remaining))));
      remaining = remaining - lines[i].length - 1;
    }
  } else {
    header = "طلب رقم " + c.ticket.number;
    lines = c.order.lines;
    shown = lines;
    size = 15;
    lh = 20;
  }

  const h = 34 + lines.length * lh + 8;
  const top = 184 - h;
  withShadow(14, 4, "rgba(0,0,0,0.35)", function () {
    outlinedRound(cx - W / 2, top, W, h, 18, "#fff3df", 3, "rgba(58,33,18,0.7)");
  });
  ctx.fillStyle = "#fff3df";
  ctx.beginPath();
  ctx.moveTo(620, 183); ctx.lineTo(660, 183); ctx.lineTo(640, 203);
  ctx.closePath();
  ctx.fill();
  ctx.strokeStyle = "rgba(58,33,18,0.7)";
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(620, 183); ctx.lineTo(640, 203); ctx.lineTo(660, 183);
  ctx.stroke();
  ctx.fillStyle = "#fff3df";
  ctx.fillRect(623, 181, 34, 5);

  fillRound(cx + W / 2 - 24 - header.length * 8, top + 8, header.length * 8 + 16, 20, 10, "rgba(201,122,48,0.2)");
  drawText(header, cx + W / 2 - 16, top + 23, 13, "#a85a1c", "right");
  for (let i = 0; i < shown.length; i++) {
    drawText(shown[i], cx + W / 2 - 18, top + 34 + (i + 1) * lh - 6, size, "#2b1d14", "right");
  }

  // شريط الصبر
  fillRound(540, 208, 200, 12, 6, "#2b1d14");
  let barColor = "#5aa335";
  if (ratio <= 0.25) {
    barColor = "#d62f2a";
  } else if (ratio <= 0.5) {
    barColor = "#f2b134";
  }
  fillRound(540, 208, Math.max(12, 200 * ratio), 12, 6, barColor);
  strokeRound(540, 208, 200, 12, 6, "rgba(0,0,0,0.5)", 2);
}

// الزبون في مكانه (1 أو 2 على الكاونتر)، بيدخل من الشمال وبيتنفس
function drawCustomer(c, slot) {
  const cx = layout().cust[slot];
  const sc = slotCount() === 2 ? 0.82 : 1;
  const e = c.enter === undefined ? 1 : c.enter;
  const ease = 1 - Math.pow(1 - e, 3);
  const ratio = c.patience / c.maxPatience;
  const talking = c.state === "ordering" && c.dlg.t * 32 < c.dlg.lines[c.dlg.idx].length && e >= 1;

  ctx.save();
  ctx.translate(cx, 542);
  ctx.scale(sc, sc);
  ctx.translate(-640, -542);
  ctx.translate(-(1 - ease) * 360, Math.sin(game.time * 2 + slot) * 1.5 + Math.abs(Math.sin(game.time * 12)) * (1 - ease) * 8);

  // ضل على الأرض
  drawEllipse(640, 548, 110, 14, "rgba(0,0,0,0.25)");

  ctx.save();
  if (c.look.kid) {
    ctx.translate(640, 542);
    ctx.scale(0.78, 0.78);
    ctx.translate(-640, -542);
  }
  drawCustomerBody(c.look, ratio, talking);
  ctx.restore();

  ctx.save();
  if (c.look.kid) {
    ctx.translate(0, 69);
  }
  drawBubble(c, ratio);
  ctx.restore();
  ctx.restore();
}

// صورة شخصية دايرية (للتسجيل والقوائم)
function drawAvatar(look, cx, cy, r, focusY, range) {
  const fy = focusY === undefined ? 335 : focusY;
  const rg = range === undefined ? 100 : range;
  ctx.save();
  ctx.beginPath();
  ctx.arc(cx, cy, r, 0, Math.PI * 2);
  ctx.clip();
  ctx.fillStyle = vGradient(cy - r, cy + r, "#f7c85a", "#c97a30");
  ctx.fillRect(cx - r, cy - r, r * 2, r * 2);
  ctx.translate(cx, cy);
  ctx.scale(r / rg, r / rg);
  ctx.translate(-640, -fy);
  drawCustomerBody(look, 1, false);
  ctx.restore();
  ctx.strokeStyle = "rgba(40,22,12,0.85)";
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.arc(cx, cy, r, 0, Math.PI * 2);
  ctx.stroke();
}

  <script>
// ===== kitchen.js: منطق المطبخ ومحطة البطاطس والمشروبات =====
// الأطباق: كل طلب ليه طبق. الطبقات اللي لسه بتطير بتتحسب في game.pendings

// الطبقات اللي على الطبق + اللي بتطير ليه
function layersOf(i) {
  return game.plates[i].concat(game.pendings[i]);
}

function platePending(i) {
  return game.plates[i].length + game.pendings[i].length;
}

function plateTop(i) {
  return burgerTopY(layersOf(i), PLATE_BASE_Y, layout().plateScale);
}

// هل الطبق ده يقبل المكون ده في الترتيب الصح؟
function canAccept(layers, type) {
  const hasPatty = layers.some(function (l) { return l.type === "patty"; });
  const hasCheese = layers.some(function (l) { return l.type === "cheese"; });
  const buns = layers.filter(function (l) { return l.type === "bun"; }).length;
  if (type === "bun") {
    return layers.length === 0 || (hasPatty && buns < 2);
  }
  if (type === "sauce") {
    return layers.length === 1 && layers[0].type === "bun";
  }
  if (type === "patty") {
    return buns === 1 && !hasPatty;
  }
  if (type === "cheese") {
    return hasPatty && !hasCheese && buns === 1;
  }
  return true;
}

// المكون بيروح للطبق المتحدد لو مناسب، وإلا للطبق التاني لو هو اللي مناسب
function pickPlate(type) {
  const sel = selSlot();
  if (canAccept(layersOf(sel), type)) {
    return sel;
  }
  if (slotCount() === 2) {
    const other = 1 - sel;
    if (canAccept(layersOf(other), type)) {
      game.sel = other;
      showMessage("المكون راح لطبق طلب " + (other + 1), "#ffd36b");
      return other;
    }
  }
  return sel;
}

function removePending(idx, type) {
  const k = game.pendings[idx].findIndex(function (p) { return p.type === type; });
  if (k >= 0) {
    game.pendings[idx].splice(k, 1);
  }
}

// رغيف أو جبنة بيطيروا من الصندوق للطبق المناسب
function addLayerFromBin(type, kind, bin, stockKey, label) {
  if (game.stock[stockKey] <= 0) {
    denyClick(label + " خلص! اطلب من اللابتوب");
    return;
  }
  const idx = pickPlate(type);
  if (platePending(idx) >= 6) {
    denyClick("الطبق مليان!");
    return;
  }
  const y1 = plateTop(idx) - 10;
  game.stock[stockKey] = game.stock[stockKey] - 1;
  game.pendings[idx].push({ type: type });
  playSound("pop");
  addFlyer({
    kind: kind, x0: bin.x + bin.w / 2, y0: bin.y + 60, x1: plateX(idx), y1: y1, dur: 0.4,
    onDone: function () {
      removePending(idx, type);
      game.plates[idx].push({ type: type });
    }
  });
}

function onSauceClick(s) {
  if (!tutAllow("sauce")) {
    return;
  }
  if (game.stream !== null) {
    return;
  }
  if (game.stock[s.key] <= 0) {
    denyClick(s.label + " خلص! اطلب من اللابتوب");
    return;
  }
  const idx = pickPlate("sauce");
  if (platePending(idx) >= 6) {
    denyClick("الطبق مليان!");
    return;
  }
  const y1 = plateTop(idx) - 4;
  game.stock[s.key] = game.stock[s.key] - 1;
  game.pendings[idx].push({ type: "sauce", key: s.key });
  playSound("squirt");
  game.stream = {
    key: s.key, color: s.color, x0: s.x, y0: 206, x1: plateX(idx), y1: y1, t: 0, dur: 0.8,
    onDone: function () {
      removePending(idx, "sauce");
      game.plates[idx].push({ type: "sauce", key: s.key, color: s.color });
    }
  };
}

function onSlotClick(i) {
  if (!tutAllow("patty")) {
    return;
  }
  const p = game.grill[i];
  if (p === null || p.arriving) {
    return;
  }
  const idx = pickPlate("patty");
  if (platePending(idx) >= 6) {
    denyClick("الطبق مليان!");
    return;
  }
  const y1 = plateTop(idx) - 12;
  const done = getDoneness(p.cook);
  game.grill[i] = null;
  game.pendings[idx].push({ type: "patty", doneness: done });
  playSound("pop");
  addFlyer({
    kind: "patty", doneness: done, x0: STOVE_SLOTS[i].x, y0: STOVE_SLOTS[i].y, x1: plateX(idx), y1: y1, dur: 0.45,
    onDone: function () {
      removePending(idx, "patty");
      game.plates[idx].push({ type: "patty", doneness: done });
    }
  });
}

function discardPlate() {
  if (!tutAllow("discard")) {
    return;
  }
  const idx = selSlot();
  if (game.pendings[idx].length > 0) {
    return;
  }
  game.plates[idx] = [];
}

function sendToTray() {
  if (!tutAllow("send")) {
    return;
  }
  const idx = selSlot();
  if (game.pendings[idx].length > 0) {
    return;
  }
  if (game.plates[idx].length === 0) {
    denyClick("الطبق فاضي!");
    return;
  }
  if (trayFull(idx)) {
    denyClick("الصينية مليانة!");
    return;
  }
  game.trays[idx].push({ kind: "burger", layers: game.plates[idx] });
  game.plates[idx] = [];
  playSound("pop");
  showMessage(slotCount() === 2 ? "البرجر اتحط على صينية طلب " + (idx + 1) : "البرجر اتحط على الصينية", "#8fdc5a");
}

function plateX(i) {
  return layout().plate[i];
}

function addFlyer(f) {
  f.t = 0;
  game.flyers.push(f);
}

function freeSlot(list, limit) {
  for (let i = 0; i < limit; i++) {
    if (list[i] === null) {
      return i;
    }
  }
  return -1;
}

function onBunClick() {
  if (!tutAllow("bun")) {
    return;
  }
  addLayerFromBin("bun", "bun", BUN_BIN, "buns", "الرغيف");
}

function onCheeseClick() {
  if (!tutAllow("cheese")) {
    return;
  }
  if (game.up.cheese < 1) {
    denyClick("الجبنة مقفولة! افتحها من التطويرات");
    return;
  }
  addLayerFromBin("cheese", "cheese", CHEESE_BIN, "cheese", "الجبنة");
}

function onFreezerClick() {
  if (!tutAllow("freezer")) {
    return;
  }
  if (game.stock.patties <= 0) {
    denyClick("الفريزر فاضي! اطلب باتي من اللابتوب");
    return;
  }
  const slot = freeSlot(game.grill, stoveBurners());
  if (slot === -1) {
    denyClick("البوتاجاز مليان!");
    return;
  }
  game.stock.patties = game.stock.patties - 1;
  game.freezerOpen = 1;
  game.grill[slot] = { cook: 0, arriving: true, alerted: false };
  playSound("freezer");
  addFlyer({
    kind: "patty", doneness: "raw", x0: FREEZER_BOX.x + 95, y0: FREEZER_BOX.y + 150,
    x1: STOVE_SLOTS[slot].x, y1: STOVE_SLOTS[slot].y, dur: 0.6,
    onDone: function () {
      game.grill[slot].arriving = false;
      playSound("sizzle");
    }
  });
}

function trayFull(i) {
  return game.trays[i].length + game.trayPendings[i] >= TRAY_MAX;
}

function clearTray(i) {
  game.trays[i] = [];
}

function selectSlot(i) {
  game.sel = i;
  playSound("click");
}

function onPotatoClick() {
  if (!tutAllow("potato")) {
    return;
  }
  if (game.up.fries < 1) {
    denyClick("البطاطس مقفولة! افتحها من التطويرات");
    return;
  }
  if (game.stock.potatoes <= 0) {
    denyClick("البطاطس خلصت! اطلب من اللابتوب");
    return;
  }
  const slot = freeSlot(game.fryer, fryerSlots());
  if (slot === -1) {
    denyClick("القلاية مليانة!");
    return;
  }
  game.stock.potatoes = game.stock.potatoes - 1;
  game.fryer[slot] = { cook: 0, arriving: true, alerted: false };
  playSound("pop");
  addFlyer({
    kind: "potato", x0: POTATO_BIN.x + 65, y0: POTATO_BIN.y + 50, x1: FRYER_SLOTS[slot].x, y1: FRYER_SLOTS[slot].y, dur: 0.5,
    onDone: function () {
      game.fryer[slot].arriving = false;
      playSound("sizzle");
    }
  });
}

function onFryerClick(i) {
  if (!tutAllow("fry")) {
    return;
  }
  const p = game.fryer[i];
  const idx = selSlot();
  if (p === null || p.arriving) {
    return;
  }
  if (trayFull(idx)) {
    denyClick("الصينية مليانة!");
    return;
  }
  const done = getFryDoneness(p.cook);
  game.fryer[i] = null;
  game.trayPendings[idx] = game.trayPendings[idx] + 1;
  playSound("pop");
  addFlyer({
    kind: "fries", doneness: done, x0: FRYER_SLOTS[i].x, y0: FRYER_SLOTS[i].y, x1: TRAY_PREVIEW.x, y1: TRAY_PREVIEW.y - 20, dur: 0.5,
    onDone: function () {
      game.trays[idx].push({ kind: "fries", doneness: done });
      game.trayPendings[idx] = game.trayPendings[idx] - 1;
    }
  });
}

function onCupStackClick() {
  if (!tutAllow("cup")) {
    return;
  }

// ===== bank.js: البنك (إيداع وسحب وقروض بالليفل وفايدة وأقساط) =====

// القروض بتتفتح بالليفل: بتبدأ بـ 500 بس وكل ما ليفلك يزيد بتتفتح قروض أكبر
const LOAN_AMOUNTS = [500, 1000, 2000, 5000, 10000];
const LOAN_LEVELS = [1, 2, 4, 6, 8];

function loanUnlocked(i) {
  return game.level >= LOAN_LEVELS[i];
}

function maxLoan() {
  let m = 0;
  for (let i = 0; i < LOAN_AMOUNTS.length; i++) {
    if (loanUnlocked(i)) {
      m = LOAN_AMOUNTS[i];
    }
  }
  return m;
}

function bankLog(type, amount) {
  game.bank.history.unshift({ day: game.day, type: type, amount: amount, balance: game.bank.balance });
  if (game.bank.history.length > 20) {
    game.bank.history.pop();
  }
}

function totalFunds() {
  return game.cash + game.bank.balance;
}

function canPay(amount) {
  return totalFunds() >= amount;
}

// الدفع بيبدأ من الكاش وبعدين من البنك (زي الكارت)
function pay(amount, label) {
  const fromCash = Math.min(game.cash, amount);
  game.cash = game.cash - fromCash;
  const rest = amount - fromCash;
  if (rest > 0) {
    game.bank.balance = game.bank.balance - rest;
    bankLog("دفع بالبطاقة: " + label, -rest);
  }
}

// خصم تلقائي (للأقساط): من البنك الأول وبعدين الكاش
function takeFunds(amount) {
  if (totalFunds() < amount) {
    return false;
  }
  const fromBank = Math.min(game.bank.balance, amount);
  game.bank.balance = game.bank.balance - fromBank;
  game.cash = game.cash - (amount - fromBank);
  return true;
}

function bankDeposit() {
  const amount = BANK_AMOUNTS[game.bankUI.amountIdx];
  if (game.cash < amount) {
    denyClick("الكاش مش كفاية للإيداع");
    return;
  }
  game.cash = game.cash - amount;
  game.bank.balance = game.bank.balance + amount;
  bankLog("إيداع", amount);
  playSound("chaching");
  showMessage("اتودع " + amount + " EGP في البنك", "#8fdc5a");
  saveGame(false);
}

function bankWithdraw() {
  const amount = BANK_AMOUNTS[game.bankUI.amountIdx];
  if (game.bank.balance < amount) {
    denyClick("رصيد البنك مش كفاية");
    return;
  }
  game.bank.balance = game.bank.balance - amount;
  game.cash = game.cash + amount;
  bankLog("سحب", -amount);
  playSound("chaching");
  showMessage("سحبت " + amount + " EGP", "#8fdc5a");
  saveGame(false);
}

function takeLoan() {
  const b = game.bank;
  const i = game.bankUI.loanIdx;
  const amount = LOAN_AMOUNTS[i];
  const term = LOAN_TERMS[game.bankUI.termIdx];
  if (!loanUnlocked(i)) {
    denyClick("القرض ده بيتفتح عند ليفل " + LOAN_LEVELS[i] + " (ليفلك " + game.level + ")");
    return;
  }
  if (b.score < 500) {
    denyClick("تقييمك الائتماني ضعيف، سدد أقساطك الأول");
    return;
  }
  if (b.loans.length >= 2) {
    denyClick("عندك قرضين شغالين، سدد الأول");
    return;
  }
  const owed = Math.round(amount * (1 + LOAN_RATE));
  const id = b.nextLoanId;
  b.nextLoanId = id + 1;
  b.loans.push({ id: id, principal: amount, owed: owed, daily: Math.ceil(owed / term), daysLeft: term });
  b.balance = b.balance + amount;
  bankLog("قرض رقم " + id, amount);
  playSound("chaching");
  showMessage("اتحول " + amount + " EGP لحساب البنك", "#8fdc5a");
  saveGame(false);
}

function repayLoan(loan) {
  if (!takeFunds(loan.owed)) {
    denyClick("فلوسك مش كفاية لسداد القرض");
    return;
  }
  game.bank.loans.splice(game.bank.loans.indexOf(loan), 1);
  game.bank.score = Math.min(850, game.bank.score + 10);
  bankLog("سداد قرض رقم " + loan.id, -loan.owed);
  playSound("chaching");
  showMessage("سددت القرض كله", "#8fdc5a");
  saveGame(false);
}

// آخر اليوم: فايدة وأقساط
function processBankDay() {
  const b = game.bank;
  const st = game.stats;
  const interest = Math.floor(b.balance * BANK_INTEREST);
  if (interest > 0) {
    b.balance = b.balance + interest;
    st.interest = interest;
    bankLog("فايدة يومية", interest);
  }
  for (let i = b.loans.length - 1; i >= 0; i--) {
    const L = b.loans[i];
    const due = Math.min(L.daily, L.owed);
    if (takeFunds(due)) {
      L.owed = L.owed - due;
      st.loanPaid = st.loanPaid + due;
      b.score = Math.min(850, b.score + 5);
      bankLog("قسط قرض رقم " + L.id, -due);
    } else {
      st.loanMissed = st.loanMissed + 1;
      b.score = Math.max(300, b.score - 40);
      const fee = Math.round(L.owed * 0.05);
      L.owed = L.owed + fee;
      bankLog("غرامة تأخير على قرض " + L.id + " (" + fee + ")", 0);
    }
    L.daysLeft = Math.max(0, L.daysLeft - 1);
    if (L.owed <= 0) {
      b.loans.splice(i, 1);
      bankLog("تم سداد قرض رقم " + L.id, 0);
    } else if (L.daysLeft === 0) {
      L.daily = L.owed;
    }
  }
}

function drawFloorTiles(topY) {
  ctx.fillStyle = vGradient(topY, 720, "#7a5238", "#4f321f");
  ctx.fillRect(0, topY, 1280, 720 - topY);
  const rows = [];
  let yy = topY;
  let step = 12;
  while (yy < 720) {
    rows.push(yy);
    yy = yy + step;
    step = step * 1.35;
  }
  rows.push(720);
  for (let r = 0; r < rows.length - 1; r++) {
    const t0 = (rows[r] - topY) / (720 - topY);
    const t1 = (rows[r + 1] - topY) / (720 - topY);
    for (let i = -10; i < 10; i++) {
      if (Math.abs((i + r) % 2) === 0) {
        continue;
      }
      ctx.beginPath();
      ctx.moveTo(640 + i * (60 + 170 * t0), rows[r]);
      ctx.lineTo(640 + (i + 1) * (60 + 170 * t0), rows[r]);
      ctx.lineTo(640 + (i + 1) * (60 + 170 * t1), rows[r + 1]);
      ctx.lineTo(640 + i * (60 + 170 * t1), rows[r + 1]);
      ctx.closePath();
      ctx.fillStyle = "rgba(255,235,200,0.1)";
      ctx.fill();
    }
  }
  ctx.strokeStyle = "rgba(0,0,0,0.2)";
  ctx.lineWidth = 2;
  ctx.beginPath();
  for (let i = -8; i <= 8; i++) {
    ctx.moveTo(640 + i * 60, topY);
    ctx.lineTo(640 + i * 230, 720);
  }
  for (let r = 0; r < rows.length; r++) {
    ctx.moveTo(0, rows[r]);
    ctx.lineTo(1280, rows[r]);
  }
  ctx.stroke();
}

  ctx.lineWidth = 4;
  ctx.lineCap = "round";
  for (let k = 0; k < 16; k++) {

    const flick = 3 + Math.sin(game.time * 14 + k * 1.7) * 3;
    ctx.strokeStyle = k % 2 === 0 ? "#4aa3ff" : "#bfe0ff";
    ctx.beginPath();
    ctx.moveTo(cx + Math.cos(a) * 46, cy + Math.sin(a) * 46);
    ctx.lineTo(cx + Math.cos(a) * (52 + flick), cy + Math.sin(a) * (52 + flick));
    ctx.stroke();
  }
}

function drawStove() {
  withShadow(18, 8, "rgba(0,0,0,0.45)", function () {
    outlinedRound(780, 440, 460, 210, 16, vGradient(440, 650, "#eef1f3", "#98a1a9"), 3);

  for (let i = 0; i < STOVE_SLOTS.length; i++) {
    const s = STOVE_SLOTS[i];
    const p = game.grill[i];
    drawEllipse(s.x, s.y, 52, 52, "#15181b");
    drawEllipse(s.x, s.y, 36, 36, "#2a2e33");
    if (i >= stoveBurners()) {
      drawLockOverlay(s.x - 56, s.y - 56, 112, 112, 56, "مقفول");
      continue;
    }
    ctx.strokeStyle = "#5a6068";
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.moveTo(s.x - 52, s.y); ctx.lineTo(s.x + 52, s.y);
    ctx.moveTo(s.x, s.y - 52); ctx.lineTo(s.x, s.y + 52);
    ctx.stroke();

    if (p === null || p.arriving) {
      continue;
    }
    drawFlames(s.x, s.y);
    fillRound(s.x + 40, s.y - 7, 48, 14, 6, "#1a110b");
    const pan = ctx.createRadialGradient(s.x - 12, s.y - 12, 4, s.x, s.y, 46);
    pan.addColorStop(0, "#7d8791");
    pan.addColorStop(1, "#2f343a");
    drawEllipse(s.x, s.y, 45, 45, pan);
    ctx.strokeStyle = "rgba(0,0,0,0.7)";
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.arc(s.x, s.y, 45, 0, Math.PI * 2);
    ctx.stroke();

    const done = getDoneness(p.cook);
    const colors = pattyColors(done);
    const grad = ctx.createRadialGradient(s.x - 10, s.y - 10, 4, s.x, s.y, 36);
    grad.addColorStop(0, colors[0]);
    grad.addColorStop(1, colors[1]);
    drawEllipse(s.x, s.y, 34, 34, grad);
    ctx.strokeStyle = "rgba(0,0,0,0.5)";
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(s.x, s.y, 34, 0, Math.PI * 2);
    ctx.stroke();
    drawEllipse(s.x - 10, s.y - 12, 10, 5, "rgba(255,255,255,0.18)");
    drawSteam(s.x, s.y - 40, done === "raw" ? 0.5 : 1);

    let ringColor = "#f2b134";
    if (done === "cooked") {
      ringColor = "#5aa335";
    } else if (done === "burnt") {
      ringColor = "#d62f2a";
    }
    const frac = Math.min(p.cook / COOK_MAX, 1);
    ctx.lineWidth = 6;
    ctx.lineCap = "round";
    ctx.strokeStyle = ringColor;
    ctx.beginPath();
    ctx.arc(s.x, s.y, 64, -Math.PI / 2, -Math.PI / 2 + frac * Math.PI * 2);
    ctx.stroke();
    if (game.hover === "slot-" + i) {
      ctx.strokeStyle = "#fff3df";
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(s.x, s.y, 72, 0, Math.PI * 2);
      ctx.stroke();
    }
  }

  drawText("الحلقة: أصفر نيّ  |  أخضر استوى  |  أحمر اتحرق", 1010, 622, 14, "#1a110b");
  for (let i = 0; i < 3; i++) {
    const on = i < stoveBurners() && game.grill[i] !== null && !game.grill[i].arriving;
    drawEllipse(STOVE_SLOTS[i].x, 640, 9, 9, "#1a110b");

    ctx.strokeStyle = "#fff3df";
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(STOVE_SLOTS[i].x, 640);
    ctx.lineTo(STOVE_SLOTS[i].x + (on ? 6 : 0), on ? 633 : 631);
    ctx.stroke();
  }
  drawText("بوتاجاز", 1222, 644, 14, "#1a110b", "right");
}

function drawStream() {

  const p = st.t / st.dur;
  const head = Math.min(1, p * 2.2);
  const tail = Math.max(0, (p - 0.55) / 0.45);
  const cx = st.x0 + (st.x1 - st.x0) * 0.1;
  const cy = st.y0 + 70;
  ctx.strokeStyle = st.color;
  ctx.lineWidth = 9;
  ctx.lineCap = "round";
  ctx.beginPath();
  for (let k = 0; k <= 12; k++) {
    const s = tail + (head - tail) * (k / 12);
    const x = (1 - s) * (1 - s) * st.x0 + 2 * (1 - s) * s * cx + s * s * st.x1;
    const y = (1 - s) * (1 - s) * st.y0 + 2 * (1 - s) * s * cy + s * s * st.y1;
    if (k === 0) {
      ctx.moveTo(x, y);
    } else {
      ctx.lineTo(x, y);
    }
  }
  ctx.stroke();
  if (head >= 1) {
    drawEllipse(st.x1, st.y1 + 2, 24 * Math.min(1, (p - 0.4) * 3), 6, st.color);
  }
}

function easeBounce(p) {
  const n = 7.5625;
  const d = 2.75;
  if (p < 1 / d) {
    return n * p * p;
  }
  if (p < 2 / d) {
    p = p - 1.5 / d;
    return n * p * p + 0.75;
  }
  if (p < 2.5 / d) {
    p = p - 2.25 / d;
    return n * p * p + 0.9375;
  }
  p = p - 2.625 / d;
  return n * p * p + 0.984375;
}

    const sx = bx0 - 200 + ((game.time * 260) % (bw + 400));
    const sheen = ctx.createLinearGradient(sx, 0, sx + 160, 0);
    sheen.addColorStop(0, "rgba(255,255,255,0)");
    sheen.addColorStop(0.5, "rgba(255,255,255,0.25)");
    sheen.addColorStop(1, "rgba(255,255,255,0)");
    ctx.fillStyle = sheen;
    ctx.fillRect(bx0, by0, bw, bh);
    ctx.restore();
    const pulse = 0.7 + Math.sin(game.time * 4) * 0.3;
    strokeRound(bx0, by0, bw, bh, 24, "rgba(242,177,52," + pulse.toFixed(2) + ")", 5);
  } else {
    drawText("برجر الحريف", 640, 230, 80, "#f2b134");
  }
  ctx.globalAlpha = 1;

  // برجر بيتبني مع التحميل
  const cx = 640;
  const baseY = 512;
  const sc = 0.85;
  drawPlate(cx, baseY + 8, 120);
  const landed = [];
  let dropping = null;
  for (let i = 0; i < LOAD_LAYERS.length; i++) {
    const ly = LOAD_LAYERS[i];
    const p = Math.max(0, Math.min(1, (frac - ly.th) / 0.1));
    const layer = ly.type === "patty2" ? { type: "patty", doneness: "cooked" } : (ly.type === "patty" ? { type: "patty", doneness: "cooked" } : (ly.type === "sauce" ? { type: "sauce", color: ly.color } : { type: ly.type }));
    if (p >= 1) {
      landed.push(layer);
    } else if (p > 0 && dropping === null) {
      dropping = { ly: ly, p: p };
    }
  }
  const squash = 1 + Math.sin(Math.min(1, (frac * 10) % 1) * Math.PI) * 0.03;
  ctx.save();
  ctx.translate(cx, baseY);
  ctx.scale(1, squash);
  ctx.translate(-cx, -baseY);
  const top = drawBurger(cx, baseY, landed, sc);
  ctx.restore();
  if (dropping !== null) {
    const e = easeBounce(dropping.p);
    const side = LOAD_LAYERS.indexOf(dropping.ly) % 2 === 0 ? -1 : 1;
    const sx = cx + side * (1 - dropping.p) * 280;
    const sy = top - 20 - (1 - e) * 170;
    drawLoadSprite(dropping.ly.type, sx, sy);
  }
  if (frac >= 1) {
    for (let k = 0; k < 6; k++) {
      const a = game.time * 3 + k * 1.05;
      drawStar(cx + Math.cos(a) * 130, top + 40 + Math.sin(a * 1.4) * 40, 7, "rgba(255,233,168,0.9)");
    }
  }

  // شريط التقدم
  const bx = 360;
  const bwid = 560;
  outlinedRound(bx, 556, bwid, 24, 12, "#1a110b", 3, "rgba(242,177,52,0.6)");
  const fw = Math.max(24, bwid * eased);
  roundRectPath(bx, 556, fw, 24, 12);
  const bar = ctx.createLinearGradient(0, 556, 0, 580);
  bar.addColorStop(0, "#ffd36b");
  bar.addColorStop(1, "#d9921c");
  ctx.fillStyle = bar;
  ctx.fill();
  ctx.save();
  roundRectPath(bx, 556, fw, 24, 12);
  ctx.clip();
  ctx.fillStyle = "rgba(255,255,255,0.4)";
  ctx.fillRect(bx + ((game.time * 220) % (fw + 60)) - 30, 556, 22, 24);
  ctx.restore();
  const dots = ".".repeat(Math.floor(game.time * 3) % 4);
  drawText("جاري التحميل" + dots, 640, 614, 21, "#fff3df");
  drawText(Math.floor(eased * 100) + "%", bx + bwid, 614, 17, "#f2b134", "right");

  // نصيحة بتتغير
  const tips = LOADING_TIPS;
  const ti = Math.floor(L.t / 2.2) % tips.length;
  const tph = (L.t % 2.2) / 2.2;
  const talpha = Math.min(1, tph * 6) * Math.min(1, (1 - tph) * 6);
  outlinedRound(240, 636, 800, 40, 16, "rgba(30,18,10,0.8)", 2, "rgba(242,177,52,0.5)");
  drawStar(272, 656, 10, "#f2b134");
  ctx.globalAlpha = talpha;
  drawText(tips[ti], 660, 662, 17, "#ffe9a8");
  ctx.globalAlpha = 1;
  drawText("By " + CREATOR_NAME, 640, 704, 14, "#8a6d55");
  drawVignette(0);

  // ستاير بتقفل لما التحميل يخلص
  const outT = Math.max(0, Math.min(1, (L.t - L.dur) / 0.4));
  if (outT > 0) {
    const w = 640 * outT;
    ctx.fillStyle = "#150c07";
    ctx.fillRect(0, 0, w, 720);
    ctx.fillRect(1280 - w, 0, w, 720);
    ctx.fillStyle = "#f2b134";
    ctx.fillRect(w - 4, 0, 4, 720);
    ctx.fillRect(1280 - w, 0, 4, 720);
  }
}

// ---------- تقرير آخر اليوم (على شكل فاتورة) ----------

function drawResultsScene() {
  ctx.fillStyle = vGradient(0, 720, "#3d2312", "#150c07");
  ctx.fillRect(0, 0, 1280, 720);
  drawFloaters();
  drawVignette(0);

  // الورقة بحافة مسننة من تحت
  withShadow(30, 12, "rgba(0,0,0,0.55)", function () {
    ctx.beginPath();
    ctx.moveTo(340, 40);
    ctx.lineTo(940, 40);
    ctx.lineTo(940, 676);
    for (let x = 940; x > 340; x -= 20) {
      ctx.lineTo(x - 10, 692);
      ctx.lineTo(x - 20, 676);
    }
    ctx.closePath();
    ctx.fillStyle = "#fff6e4";
    ctx.fill();
  });
  ctx.strokeStyle = "rgba(90,58,38,0.35)";
  ctx.lineWidth = 2;
  ctx.setLineDash([6, 6]);
  ctx.strokeRect(358, 58, 564, 590);
  ctx.setLineDash([]);

  drawText("برجر الحريف", 640, 100, 34, "#c97a30");
  drawText("تقرير اليوم " + game.day, 640, 138, 24, "#2b1d14");
  ctx.fillStyle = "#f2b134";
  ctx.fillRect(420, 150, 440, 4);

  const st = game.stats;
  const profit = st.revenue - st.spent - st.upgrades;
  const avg = averageRating();
  const rows = [
    ["زباين اتخدموا", String(st.served), "#2b1d14"],
    ["زباين مشيوا زهقانين", String(st.left), "#2b1d14"],
    ["طلبات اترفضت", String(st.rejected), "#2b1d14"],
    ["المبيعات والبقشيش", st.revenue + " EGP", "#2b1d14"],
    ["مصاريف المكونات", (st.spent > 0 ? "-" : "") + st.spent + " EGP", st.spent > 0 ? "#b3261e" : "#2b1d14"],
    ["تطويرات", (st.upgrades > 0 ? "-" : "") + st.upgrades + " EGP", st.upgrades > 0 ? "#b3261e" : "#2b1d14"],
    ["الربح", (profit >= 0 ? "+" : "") + profit + " EGP", profit >= 0 ? "#2f7a1a" : "#b3261e"],
    ["فايدة البنك", (st.interest > 0 ? "+" : "") + st.interest + " EGP", st.interest > 0 ? "#2f7a1a" : "#2b1d14"],
    ["أقساط القروض", (st.loanPaid > 0 ? "-" : "") + st.loanPaid + " EGP", st.loanPaid > 0 ? "#b3261e" : "#2b1d14"],
    ["التقييم العام", avg === null ? "-" : avg.toFixed(1) + " / 5", "#2b1d14"],
    ["الكاش دلوقتي", game.cash + " EGP", "#2b1d14"],
    ["رصيد البنك", game.bank.balance + " EGP", "#2b1d14"]
  ];
  for (let i = 0; i < rows.length; i++) {
    const y = 192 + i * 31;
    const strong = i === 6;
    if (strong) {
      fillRound(380, y - 20, 520, 28, 8, "rgba(242,177,52,0.22)");
    }
    drawText(rows[i][0], 890, y, strong ? 21 : 19, "#6b4a32", "right");
    drawText(rows[i][1], 392, y, strong ? 22 : 20, rows[i][2], "left");
    ctx.font = "bold 20px " + FONT;
    const valueEnd = 392 + ctx.measureText(rows[i][1]).width + 14;
    ctx.font = "bold " + (strong ? 21 : 19) + "px " + FONT;
    const labelStart = 890 - ctx.measureText(rows[i][0]).width - 12;
    ctx.fillStyle = "rgba(90,58,38,0.3)";
    for (let dx = valueEnd; dx < labelStart; dx += 12) {
      ctx.fillRect(dx, y - 4, 5, 2);
    }
  }
  if (st.loanMissed > 0) {
    drawText("تنبيه: اتأخرت عن قسط قرض!", 640, 584, 17, "#b3261e");
  } else {
    drawText("تم حفظ تقدمك تلقائياً", 640, 584, 15, "#8a6d55");
  }

  // ختم
  ctx.save();
  ctx.translate(866, 104);
  ctx.rotate(-0.28);
  strokeRound(-56, -22, 112, 44, 8, "rgba(201,58,52,0.75)", 4);
  drawText("تم", 0, 9, 28, "rgba(201,58,52,0.75)");
  ctx.restore();

  drawHotspotButtons();
}

  <script>
// ===== settings.js: الإعدادات + عن اللعبة + شاشة الخروج =====

const SETTINGS_KEY = "burgerLegacySettings";
const CREATOR_NAME = "Monsef Bayoumy";
const GAME_VERSION = "9";
const settings = { autoFullscreen: true, quality: "high" };

function loadSettings() {
  try {
    const d = JSON.parse(localStorage.getItem(SETTINGS_KEY) || "null");
    if (d) {
      settings.autoFullscreen = d.autoFullscreen !== false;
      settings.quality = d.quality === "low" ? "low" : "high";
      audioSettings.sfx = d.sfx !== false;
      audioSettings.music = d.music !== false;
      audioSettings.sfxVol = typeof d.sfxVol === "number" ? d.sfxVol : 0.8;
      audioSettings.musicVol = typeof d.musicVol === "number" ? d.musicVol : 0.6;
    }
  } catch (e) {
    // لو مفيش إعدادات محفوظة هنستخدم الافتراضي
  }
}

function saveSettings() {
  try {
    localStorage.setItem(SETTINGS_KEY, JSON.stringify({
      autoFullscreen: settings.autoFullscreen, quality: settings.quality,
      sfx: audioSettings.sfx, music: audioSettings.music, sfxVol: audioSettings.sfxVol, musicVol: audioSettings.musicVol
    }));
  } catch (e) {
    // مش مشكلة لو التخزين مش شغال
  }
}

// ملء الشاشة (المتصفح بيسمح بيه بعد أول ضغطة بس)
function enterFullscreen() {
  try {
    if (!document.fullscreenElement && document.documentElement.requestFullscreen) {
      const p = document.documentElement.requestFullscreen();
      if (p && p.catch) {
        p.catch(function () {});
      }
    }
  } catch (e) {
    // لو المتصفح رفض مفيش مشكلة
  }
}

function openSettings() {
  game.settingsReturn = game.scene;
  game.confirmDelete = false;
  game.scene = "settings";
}

function closeSettings() {
  saveSettings();
  game.confirmDelete = false;
  game.scene = game.settingsReturn || "menu";
}

function deleteProgress() {
  if (!game.confirmDelete) {
    game.confirmDelete = true;
    return;
  }
  game.confirmDelete = false;
  try {
    localStorage.removeItem(saveKey());
  } catch (e) {
    // مفيش حاجة تتمسح
  }
  game.started = false;
  game.xp = 0;
  game.level = 1;
  if (game.profile) {
    game.profile.level = 1;
    game.profile.xp = 0;
    saveProfiles();
  }
  refreshSaveInfo();
  showMessage("اتمسح تقدم اللاعب", "#ff7a70");
}

// الخروج من اللعبة: بيحفظ وبيقفل الصفحة لو المتصفح سمح
function exitGame() {
  if (game.started && !game.tut) {
    saveGame(false);
  }
  try {
    if (document.fullscreenElement) {
      document.exitFullscreen();
    }
  } catch (e) {
    // مش مشكلة
  }
  game.scene = "bye";
  game.byeT = 0;
  setTimeout(function () {
    try {
      window.close();
    } catch (e) {
      // لو المتصفح منع القفل، الشاشة بتفضل ظاهرة
    }
  }, 1500);
}

// ---------- أدوات رسم ----------

function drawPanelBackground() {
  ctx.fillStyle = vGradient(0, 720, "#3d2312", "#150c07");
  ctx.fillRect(0, 0, 1280, 720);
  for (let k = 0; k < 8; k++) {
    const a = (k / 8) * Math.PI * 2 + game.time * 0.04;
    ctx.fillStyle = "rgba(255,214,130,0.04)";
    ctx.beginPath();
    ctx.moveTo(640, 360);
    ctx.lineTo(640 + Math.cos(a - 0.1) * 1000, 360 + Math.sin(a - 0.1) * 1000);
    ctx.lineTo(640 + Math.cos(a + 0.1) * 1000, 360 + Math.sin(a + 0.1) * 1000);
    ctx.closePath();
    ctx.fill();
  }
  drawFloaters();
}

function drawSliderControl(box, value, on) {
  const cy = box.y + box.h / 2;
  fillRound(box.x, cy - 7, box.w, 14, 7, "#1a110b");
  fillRound(box.x, cy - 7, Math.max(14, box.w * value), 14, 7, on ? "#f2b134" : "#6b7580");
  strokeRound(box.x, cy - 7, box.w, 14, 7, "rgba(0,0,0,0.5)", 2);
  const kx = box.x + box.w * value;
  drawEllipse(kx, cy, 13, 13, "#fff3df");
  strokeRound(kx - 13, cy - 13, 26, 26, 13, "#3a2112", 3);
  drawText(Math.round(value * 100) + "%", box.x + box.w + 36, cy + 6, 16, "#fff3df");
}

  <script>
// ===== profiles.js: تسجيل اللاعبين وقايمة اللاعبين =====

// لو عايز تستقبل تسجيلات اللاعبين أونلاين، حط هنا رابط (مثلاً Google Apps Script أو Webhook).
// لو سيبته فاضي: البيانات بتتحفظ على جهاز اللاعب بس.
const REGISTRATION_URL = "";

const PROFILES_KEY = "burgerLegacyProfiles";
const CURRENT_KEY = "burgerLegacyCurrent";
const OLD_SAVE_KEY = "burgerLegacySave";
const PROFILES_PER_PAGE = 6;

let profiles = [];

function loadProfiles() {
  try {
    const d = JSON.parse(localStorage.getItem(PROFILES_KEY) || "[]");
    profiles = Array.isArray(d) ? d : [];
    const cur = localStorage.getItem(CURRENT_KEY);
    const found = profiles.filter(function (p) { return p.id === cur; })[0];
    game.profile = found || null;
  } catch (e) {
    profiles = [];
    game.profile = null;
  }
}

function saveProfiles() {
  try {
    localStorage.setItem(PROFILES_KEY, JSON.stringify(profiles));
  } catch (e) {
    // مش مشكلة لو التخزين مش شغال
  }
}

// كل لاعب ليه مكان حفظ لوحده
function saveKey() {
  return "burgerLegacySave_" + (game.profile ? game.profile.id : "guest");
}

function setCurrentProfile(p) {
  game.profile = p;
  try {
    localStorage.setItem(CURRENT_KEY, p ? p.id : "");
  } catch (e) {
    // مش مشكلة
  }
}

function selectProfile(id) {
  const p = profiles.filter(function (x) { return x.id === id; })[0];
  if (!p) {
    return;
  }
  setCurrentProfile(p);
  p.lastPlayed = Date.now();
  saveProfiles();
  game.started = false;
  game.confirmNew = false;
  game.xp = p.xp || 0;
  game.level = levelFromXp(game.xp);
  refreshSaveInfo();
  game.scene = "menu";
}

// ---------- الإرسال للسيرفر (اختياري) ----------

function trySync(p) {
  if (!REGISTRATION_URL || typeof fetch !== "function" || (typeof navigator !== "undefined" && navigator.onLine === false)) {
    return;
  }
  try {
    fetch(REGISTRATION_URL, {
      method: "POST", mode: "no-cors", headers: { "Content-Type": "text/plain" },
      body: JSON.stringify({ game: "burger-el-harif", id: p.id, name: p.name, city: p.city, contact: p.contact, created: p.created })
    }).then(function () {
      p.synced = true;
      saveProfiles();
    }).catch(function () {});
  } catch (e) {
    // هيحاول تاني المرة الجاية
  }
}

function syncPending() {
  profiles.forEach(function (p) {
    if (!p.synced) {
      trySync(p);
    }
  });
}

function exportProfiles() {
  try {
    const blob = new Blob([JSON.stringify(profiles, null, 2)], { type: "application/json" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "burger-players.json";
    document.body.appendChild(a);
    a.click();
    a.remove();
    showMessage("اتصدّر ملف اللاعبين", "#8fdc5a");
  } catch (e) {
    showMessage("مقدرتش أصدّر الملف", "#ff7a70");
  }
}

// ---------- التسجيل ----------

const REG_FIELDS = [
  { key: "name", y: 224, label: "الاسم (إجباري)", ph: "اكتب اسمك", max: 20 },
  { key: "city", y: 294, label: "المدينة (اختياري)", ph: "مثلاً: القاهرة", max: 30 },
  { key: "contact", y: 364, label: "الإيميل أو الموبايل (اختياري)", ph: "عشان نتواصل معاك", max: 40 }
];
const regInputs = {};
let regInputsVisible = false;

function emptyRegForm() {
  return { name: "", city: "", contact: "", avatar: 0 };
}

function openRegister() {
  game.regForm = emptyRegForm();
  game.regError = "";
  game.scene = "register";
}

function ensureRegInputs() {
  if (typeof document.createElement !== "function" || regInputs.name) {
    return;
  }
  REG_FIELDS.forEach(function (f) {
    const el = document.createElement("input");
    el.type = "text";
    el.maxLength = f.max;
    el.placeholder = f.ph;
    el.dir = "rtl";
    el.autocomplete = "off";
    el.style.cssText = "position:fixed;display:none;z-index:20;box-sizing:border-box;padding:0 14px;border:3px solid #c97a30;" +
      "border-radius:12px;background:#fff3df;color:#2b1d14;font-family:Cairo,Arial,sans-serif;font-weight:700;outline:none;";
    el.addEventListener("input", function () {
      game.regForm[f.key] = el.value;
    });
    el.addEventListener("keydown", function (e) {
      if (e.key === "Enter") {
        submitRegistration();
      }
    });
    document.body.appendChild(el);
    regInputs[f.key] = el;
  });
}

function layoutRegInputs() {
  const rect = canvas.getBoundingClientRect();
  const sx = rect.width / 1280;
  REG_FIELDS.forEach(function (f) {
    const el = regInputs[f.key];
    if (!el) {
      return;
    }
    el.style.left = rect.left + 380 * sx + "px";
    el.style.top = rect.top + f.y * sx + "px";
    el.style.width = 520 * sx + "px";
    el.style.height = 46 * sx + "px";
    el.style.fontSize = 20 * sx + "px";
    el.style.display = "block";
    if (document.activeElement !== el && el.value !== game.regForm[f.key]) {
      el.value = game.regForm[f.key];
    }
  });
  regInputsVisible = true;
}

// بيتنادى كل فريم: بيظهر المدخلات في التسجيل بس
function syncRegInputs() {
  if (game.scene === "register") {
    ensureRegInputs();
    if (typeof canvas.getBoundingClientRect === "function") {
      layoutRegInputs();
    }
  } else if (regInputsVisible) {
    REG_FIELDS.forEach(function (f) {
      if (regInputs[f.key]) {
        regInputs[f.key].style.display = "none";
      }
    });
    regInputsVisible = false;
  }
}

function submitRegistration() {
  const f = game.regForm;
  const name = f.name.trim();
  if (name.length < 2) {
    game.regError = "اكتب اسمك (حرفين على الأقل)";
    playSound("buzz");
    return;
  }
  if (profiles.some(function (p) { return p.name.toLowerCase() === name.toLowerCase(); })) {
    game.regError = "الاسم ده مسجل قبل كده، اختار اسم تاني";
    playSound("buzz");
    return;
  }
  const isFirst = profiles.length === 0;
  const p = {
    id: "p" + Date.now().toString(36) + Math.floor(Math.random() * 1000), name: name, city: f.city.trim(), contact: f.contact.trim(),
    avatar: f.avatar, created: Date.now(), lastPlayed: Date.now(), level: 1, xp: 0, tutorialDone: false, synced: false
  };
  profiles.push(p);
  saveProfiles();
  setCurrentProfile(p);
  // لو فيه لعبة قديمة (قبل التسجيل) بنربطها بأول لاعب
  game.menuNote = "";
  try {
    const old = localStorage.getItem(OLD_SAVE_KEY);
    if (isFirst && old) {
      localStorage.setItem(saveKey(), old);
      game.menuNote = "لقينا لعبتك القديمة وربطناها بحسابك";
    }
  } catch (e) {
    // مش مشكلة
  }
  trySync(p);
  game.started = false;
  game.xp = 0;
  game.level = 1;
  refreshSaveInfo();
  game.regForm = emptyRegForm();
  playSound("start");
  startTutorial(true);
}

function drawRegisterScene() {
  drawPanelBackground();
  withShadow(24, 10, "rgba(0,0,0,0.5)", function () {
    outlinedRound(300, 60, 680, 650, 26, "rgba(30,18,10,0.86)", 3, "rgba(242,177,52,0.75)");
  });
  drawText("أهلاً بيك في برجر الحريف!", 640, 108, 30, "#f2b134");
  drawText("سجّل بياناتك عشان نحفظ تقدمك", 640, 144, 18, "#e8d3b0");
  REG_FIELDS.forEach(function (f) {
    drawText(f.label, 900, f.y - 8, 16, "#fff3df", "right");
  });
  drawText("اختار شخصيتك", 900, 446, 18, "#fff3df", "right");
  for (let i = 0; i < CHARACTERS.length; i++) {
    const p = regAvatarPos(i);
    const sel = game.regForm.avatar === i;
    if (sel) {
      drawEllipse(p.x, p.y, 36, 36, "rgba(242,177,52,0.35)");
    }
    drawAvatar(CHARACTERS[i], p.x, p.y, sel ? 31 : 27);
    if (game.hover === "avatar-" + i) {
      ctx.strokeStyle = "#fff3df";
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(p.x, p.y, 33, 0, Math.PI * 2);
      ctx.stroke();
    }
  }
  if (game.regError) {
    drawText(game.regError, 640, 618, 17, "#ff7a70");
  }
  drawText("بياناتك بتتحفظ على جهازك، وممكن تتبعت لصانع اللعبة لما يكون فيه إنترنت", 640, 702, 13, "#8a6d55");
  drawHotspotButtons();
  drawVignette(0);
}

function regAvatarPos(i) {
  if (i < 7) {
    return { x: 640 + (i - 3) * 76, y: 496 };
  }
  return { x: 640 + (i - 7 - 2.5) * 76, y: 568 };
}

SCENE_DRAW.register = drawRegisterScene;
SCENE_HOTSPOTS.register = function () {
  const list = [];
  for (let i = 0; i < CHARACTERS.length; i++) {
    const p = regAvatarPos(i);
    list.push({
      name: "avatar-" + i, box: { x: p.x - 34, y: p.y - 34, w: 68, h: 68 },
      action: (function (k) { return function () { game.regForm.avatar = k; playSound("pop"); }; })(i)
    });
  }
  list.push({
    name: "reg-submit", box: { x: 480, y: 630, w: 320, h: 52 }, label: "سجّل وابدأ", size: 23,
    color: "#f2b134", textColor: "#2b1d14", action: submitRegistration
  });
  if (profiles.length > 0) {
    list.push({
      name: "reg-back", box: { x: 330, y: 636, w: 120, h: 42 }, label: "رجوع", size: 17,
      color: "#6b7580", textColor: "#fff3df", action: function () { game.scene = "players"; }
    });
  }
  return list;
};

// ---------- قايمة اللاعبين ----------

function openPlayers() {
  game.playersPage = 0;
  game.confirmProfileDelete = "";
  game.scene = "players";
}

function deleteProfile(id) {
  if (game.confirmProfileDelete !== id) {
    game.confirmProfileDelete = id;
    return;
  }
  game.confirmProfileDelete = "";
  try {
    localStorage.removeItem("burgerLegacySave_" + id);
  } catch (e) {
    // مش مشكلة
  }
  profiles = profiles.filter(function (p) { return p.id !== id; });
  saveProfiles();
  if (game.profile && game.profile.id === id) {
    setCurrentProfile(null);
    game.started = false;
  }
  if (profiles.length === 0) {
    openRegister();
  }
}

function playerCardBox(i) {
  const col = i % 2;
  const row = Math.floor(i / 2);
  return { x: col === 0 ? 650 : 270, y: 168 + row * 124, w: 360, h: 112 };
}

function drawPlayersScene() {
  drawPanelBackground();
  withShadow(24, 10, "rgba(0,0,0,0.5)", function () {
    outlinedRound(240, 60, 800, 650, 26, "rgba(30,18,10,0.86)", 3, "rgba(242,177,52,0.75)");
  });
  drawText("اللاعبين على الجهاز", 640, 108, 30, "#f2b134");
  drawText("عدد المسجلين: " + profiles.length, 640, 144, 18, "#e8d3b0");
  const start = (game.playersPage || 0) * PROFILES_PER_PAGE;
  const page = profiles.slice(start, start + PROFILES_PER_PAGE);
  for (let i = 0; i < page.length; i++) {
    const p = page[i];
    const b = playerCardBox(i);
    const isCur = game.profile && game.profile.id === p.id;
    const hot = game.hover === "player-" + p.id;
    outlinedRound(b.x, b.y, b.w, b.h, 16, hot ? "rgba(255,243,223,0.2)" : "rgba(255,243,223,0.1)", 3, isCur ? "#8fdc5a" : "rgba(242,177,52,0.4)");
    drawAvatar(CHARACTERS[p.avatar % CHARACTERS.length], b.x + b.w - 56, b.y + 56, 38);
    drawText(p.name, b.x + b.w - 108, b.y + 40, 22, "#fff3df", "right");
    drawText("Lv " + levelFromXp(p.xp || 0) + (p.city ? " - " + p.city : ""), b.x + b.w - 108, b.y + 68, 15, "#ffd36b", "right");
    drawText("آخر لعب: " + new Date(p.lastPlayed).toLocaleDateString("ar-EG"), b.x + b.w - 108, b.y + 92, 13, "#bfe3f2", "right");
    if (isCur) {
      drawText("الحالي", b.x + 70, b.y + 40, 15, "#8fdc5a");
    }
  }
  if (profiles.length > PROFILES_PER_PAGE) {
    drawText("صفحة " + ((game.playersPage || 0) + 1) + " / " + Math.ceil(profiles.length / PROFILES_PER_PAGE), 640, 560, 15, "#bfe3f2");
  }
  drawText("دوس على اللاعب عشان تلعب بيه", 640, 592, 15, "#8a6d55");
  drawHotspotButtons();
  drawVignette(0);
  drawMessage();
}

SCENE_DRAW.players = drawPlayersScene;
SCENE_HOTSPOTS.players = function () {
  const list = [];
  const start = (game.playersPage || 0) * PROFILES_PER_PAGE;
  const page = profiles.slice(start, start + PROFILES_PER_PAGE);
  page.forEach(function (p, i) {
    const b = playerCardBox(i);
    list.push({ name: "player-" + p.id, box: b, action: function () { selectProfile(p.id); playSound("start"); } });
    const del = game.confirmProfileDelete === p.id;
    list.push({
      name: "pdel-" + p.id, box: { x: b.x + 8, y: b.y + 66, w: del ? 100 : 36, h: 30 }, label: del ? "متأكد؟" : "×", size: 15,
      color: "#d62f2a", textColor: "#fff3df", action: (function (id) { return function () { deleteProfile(id); }; })(p.id)
    });
  });
  if (profiles.length > PROFILES_PER_PAGE) {
    const pages = Math.ceil(profiles.length / PROFILES_PER_PAGE);
    if ((game.playersPage || 0) < pages - 1) {
      list.push({ name: "pl-next", box: { x: 520, y: 542, w: 90, h: 34 }, label: "التالي", size: 15, color: "#6b7580", textColor: "#fff3df", action: function () { game.playersPage++; } });
    }
    if ((game.playersPage || 0) > 0) {
      list.push({ name: "pl-prev", box: { x: 670, y: 542, w: 90, h: 34 }, label: "السابق", size: 15, color: "#6b7580", textColor: "#fff3df", action: function () { game.playersPage--; } });
    }
  }
  list.push({
    name: "pl-new", box: { x: 290, y: 624, w: 220, h: 50 }, label: "لاعب جديد", size: 20,
    color: "#5aa335", textColor: "#10260a", action: openRegister
  });
  list.push({
    name: "pl-export", box: { x: 530, y: 624, w: 260, h: 50 }, label: "تصدير بيانات اللاعبين", size: 17,
    color: "#3d6fbf", textColor: "#fff3df", action: exportProfiles
  });
  if (game.profile) {
    list.push({
      name: "pl-back", box: { x: 810, y: 624, w: 190, h: 50 }, label: "رجوع", size: 20,
      color: "#d62f2a", textColor: "#fff3df", action: function () { game.scene = "menu"; }
    });
  }
  return list;
};

  <script>
// ===== tutorial.js: التدريب (كل حاجة مفتوحة فيه وبالمصري) =====

// ---------- أدوات الدروس ----------

function tutOrder(items) {
  let price = 0;
  const lines = [];
  items.forEach(function (it) {
    price = price + MENU[it.id].price;
    lines.push(MENU[it.id].name + (it.kind === "burger" ? sauceNote(it.sauce) : ""));
  });
  return { items: items, price: price, lines: lines, text: lines.join(" + ") };
}

// زبون بطلب محدد، وصبره مبينتهيش في التدريب
function tutSpawn(lookIdx, items) {
  const look = CHARACTERS[lookIdx];
  const order = tutOrder(items);
  game.customers = [null, null];
  game.customers[0] = {
    state: "ordering", look: look, maxPatience: 999, patience: 999, order: order, enter: 0,
    dlg: { lines: buildDialogue(look, order), idx: 0, t: 0 }, ticket: null
  };
  playSound("bell");
  playSound("talk", look.voice);
}

function c0() {
  return game.customers[0];
}

function plateHas(type, key) {
  return game.plates[0].some(function (l) { return l.type === type && (!key || l.key === key); });
}

function trayHas(kind) {
  return game.trays[0].some(function (t) { return t.kind === kind; });
}

function sameTypes(layers, types) {
  return layers.length === types.length && layers.every(function (l, i) { return l.type === types[i]; });
}

// لو الطبق اتبوّظ (حاجة غلط) بنفضّيه ونرجع لأول الدرس
function plateGuard(before, startId) {
  return function () {
    if (game.pendings[0].length > 0 || game.stream !== null) {
      return null;
    }
    if (!sameTypes(game.plates[0], before)) {
      game.plates[0] = [];
      showMessage("ولا يهمك! هنبدأ الطبق من جديد", "#ffd36b");
      return startId;
    }
    return null;
  };
}

function ensureCookedPatty() {
  if (!game.grill.some(function (p) { return p !== null; }) && !plateHas("patty")) {
    game.grill[0] = { cook: 6.5, arriving: false, alerted: true };
  }
}

// ---------- الخطوات ----------

const TUT_STEPS = [
  { id: "welcome", scene: "counter", info: true,
    text: "أهلاً يا شيف! أنا الشيف حريف وهعلمك الشغل خطوة بخطوة. في التدريب كل حاجة مفتوحة وبتجرب براحتك، ومفيش حاجة هتتحسب عليك." },
  { id: "hud", scene: "counter", info: true, box: { x: 0, y: 0, w: 1280, h: 64 },
    text: "فوق عندك: اسم المطعم والليفل بتاعك، اليوم والساعة، تقييم الزباين، أزرار (ملء الشاشة والصوت والقائمة)، وعلى اليمين فلوسك." },
  { id: "arrive", scene: "counter",
    text: "شوف! زبون دخل المطعم وبيتكلم بكلام غريب ومضحك. استنى لحد ما يقول طلبه في الآخر.",
    enter: function () { tutSpawn(0, [{ kind: "burger", id: "classic", sauce: "ketchup" }]); },
    done: function () { return c0() && (c0().state === "waiting" || (c0().dlg.idx >= c0().dlg.lines.length - 1 && c0().dlg.t > 1.2)); } },
  { id: "take", scene: "counter", target: "takeOrder-0", text: "دوس على 'خُد الطلب' عشان تسجل الطلب.",
    done: function () { return c0() && c0().state === "waiting"; } },
  { id: "ticket", scene: "counter", info: true, box: { x: 440, y: 80, w: 400, h: 160 },
    text: "الطلب اتسجل وبيظهر فوق راس الزبون وعلى تذكرة في المطبخ. وخلي بالك من الشريط الأخضر: لو خلص الزبون بيزهق ويمشي!" },
  { id: "goKitchen", scene: "kitchen", text: "يلا نروح المطبخ نحضر الطلب. دوس على 'لف للمطبخ'.",
    done: function () { return game.scene === "kitchen"; } },
  { id: "kTour", scene: "kitchen", info: true,
    text: "ده المطبخ: الفريزر على الشمال، الرغيف والجبنة في النص، الصوصات متعلقة فوق، والبوتاجاز على اليمين. التذكرة فوق على الشمال بتفكّرك بالطلب." },
  { id: "freezer", allow: ["freezer"], scene: "kitchen", target: "freezer", text: "الباتي بيبدأ من الفريزر. دوس عليه وهيروح على البوتاجاز.",
    done: function () { return game.grill.some(function (p) { return p !== null; }); } },
  { id: "wait", allow: [], scene: "kitchen", target: "slot-0",
    text: "شايف الحلقة حوالين الباتي؟ أصفر معناه نيّ، أخضر معناه استوى، وأحمر معناه اتحرق! استنى لحد ما تبقى خضرا (في التدريب مبيتحرقش).",
    guard: function () {
      if (game.plates[0].length > 0 && game.pendings[0].length === 0) {
        game.plates[0] = [];
        showMessage("لسه بدري! استنى الباتي يستوي", "#ffd36b");
      }
      if (!game.grill.some(function (p) { return p !== null; })) {
        return "freezer";
      }
      return null;
    },
    done: function () { return game.grill[0] !== null && getDoneness(game.grill[0].cook) === "cooked"; } },
  { id: "bun1", allow: ["bun"], scene: "kitchen", target: "bin-bun", text: "دلوقتي نبني البرجر من تحت لفوق. أول حاجة الرغيف التحتاني. دوس على الرغيف.",
    guard: plateGuard([], "bun1"), done: function () { return game.plates[0].length >= 1; } },
  { id: "sauce", allow: ["sauce"], scene: "kitchen", target: "sauce-ketchup", text: "الزبون طلب كاتشب. دوس على زجاجة الكاتشب وشوف الصوص بينزل على البرجر.",
    guard: plateGuard(["bun"], "bun1"), done: function () { return plateHas("sauce", "ketchup"); } },
  { id: "patty", allow: ["patty"], scene: "kitchen", target: "slot-0", text: "دوس على الباتي اللي استوى عشان يتحط على البرجر.",
    guard: function () {

// ---------- التحكم في التدريب ----------

function startTutorial(first) {
  game.tutBackup = game.started && !game.tut ? JSON.stringify(buildSaveData(false)) : null;
  game.tutFirst = !!first;
  game.tut = { step: 0, t: 0, doneT: -1, entered: -1, skipAsk: false, used: -1 };
  setupSandbox();
  playSound("start");
}

function setupSandbox() {
  game.cash = 5000;
  game.stock = { buns: 99, patties: 99, cheese: 99, ketchup: 99, mayo: 99, mustard: 99, potatoes: 99, cola: 99, orange: 99, cups: 99 };
  game.up = { cheese: 1, fries: 1, drinks: 1, tables: 2, freezer: 3, stove: 1, fryer: 1, soda: 2, warm: 1, bell: 1, double: 0 };
  game.bank = newBank();
  game.reviews = [];
  game.ratingSum = 0;
  game.ratingCount = 0;
  game.history = [];
  game.deliveries = [];
  game.cart = emptyCart();
  startDay();
  game.minutes = DAY_START + 60;
  game.spawnTimer = 99999;
  game.scene = "counter";
}

function endTutorial(completed) {
  const backup = game.tutBackup;
  game.tut = null;
  if (backup) {
    applySaveData(JSON.parse(backup));
    game.started = true;
  } else {
    game.started = false;
    game.xp = game.profile ? game.profile.xp || 0 : 0;
    game.level = levelFromXp(game.xp);
  }
  game.customers = [null, null];
  game.confirmNew = false;
  if (completed && game.profile && !game.profile.tutorialDone) {
    game.profile.tutorialDone = true;
    game.profile.bonusPending = true;
    saveProfiles();
  }
  if (completed) {
    addConfetti(70);
    playSound("levelup");
  }
  refreshSaveInfo();
  game.scene = "menu";
}

function jumpTo(id) {
  for (let i = 0; i < TUT_STEPS.length; i++) {
    if (TUT_STEPS[i].id === id) {
      game.tut.step = i;
      game.tut.entered = -1;
      game.tut.doneT = -1;
      return;
    }
  }
}

function nextStep() {
  const T = game.tut;
  if (TUT_STEPS[T.step].last) {
    endTutorial(true);
    return;
  }
  T.step = T.step + 1;
  T.doneT = -1;
}

function tutorialUpdate(dt) {
  const T = game.tut;
  if (!T || T.skipAsk) {
    return;
  }
  const st = TUT_STEPS[T.step];
  T.t = T.t + dt;
  if (T.entered !== T.step) {
    T.entered = T.step;
    T.doneT = -1;
    if (st.enter) {
      st.enter();
    }
    if (T.step > 0) {
      playSound("step");
    }
  }
  if (T.doneT < 0 && !st.info && st.done && st.done()) {
    T.doneT = 0;
    addFloat("برافو!", 640, 380, "#ffd36b", 30);
  }
  if (st.guard && T.doneT < 0) {
    const jump = st.guard();
    if (jump) {
      jumpTo(jump);
      return;
    }
  }
  if (T.doneT >= 0) {
    T.doneT = T.doneT + dt;
    if (T.doneT > 0.8) {
      nextStep();
    }
  }
}

// ---------- مساعدة الوصول (أي زرار يوصلك للمشهد المطلوب) ----------

const NAV_EDGES = [
  ["counter", "kitchen", "toKitchen"], ["counter", "laptop", "laptop"], ["counter", "book", "book"],
  ["kitchen", "counter", "kitchenBack"], ["kitchen", "sides", "toSides"], ["sides", "kitchen", "sidesBack"],
  ["sides", "counter", "sidesCounter"], ["laptop", "counter", "os-close"], ["book", "counter", "bookClose"]
];

function navHint(from, to) {
  const seen = { };
  seen[from] = true;
  const queue = [{ scene: from, first: null }];
  while (queue.length > 0) {
    const cur = queue.shift();
    for (let i = 0; i < NAV_EDGES.length; i++) {
      const e = NAV_EDGES[i];
      if (e[0] === cur.scene && !seen[e[1]]) {
        const first = cur.first || e[2];
        if (e[1] === to) {
          return first;
        }
        seen[e[1]] = true;
        queue.push({ scene: e[1], first: first });
      }
    }
  }
  return null;
}

function tutTargetBox() {
  const T = game.tut;
  const st = TUT_STEPS[T.step];
  if (st.box) {
    return st.box;
  }
  let name = st.target || null;
  if (st.scene && game.scene !== st.scene) {
    name = navHint(game.scene, st.scene);
  } else if (st.tab && game.scene === "laptop" && game.laptopTab !== st.tab) {
    if (st.tab === "home") {
      name = "dock-home";
    } else {
      name = game.laptopTab === "home" ? "app-" + st.tab : "dock-" + st.tab;
    }
  }
  if (!name) {
    return null;
  }
  const hs = getHotspots();
  for (let i = 0; i < hs.length; i++) {
    if (hs[i].name === name) {
      return hs[i].box;
    }
  }
  return null;
}

function drawTutHighlight(b) {
  const pulse = 0.5 + Math.sin(game.time * 6) * 0.5;
  const g = 5 + pulse * 5;
  ctx.strokeStyle = "rgba(255,226,120," + (0.65 + pulse * 0.35).toFixed(2) + ")";
  ctx.lineWidth = 5;
  roundRectPath(b.x - g, b.y - g, b.w + g * 2, b.h + g * 2, 16);
  ctx.stroke();
  ctx.strokeStyle = "rgba(255,255,255,0.5)";
  ctx.lineWidth = 2;
  roundRectPath(b.x - g - 4, b.y - g - 4, b.w + g * 2 + 8, b.h + g * 2 + 8, 18);
  ctx.stroke();
  // سهم بيتنطط
  const bob = Math.sin(game.time * 7) * 6;
  const above = b.y > 140;
  const ax = b.x + b.w / 2;
  const ay = above ? b.y - 22 - bob : b.y + b.h + 22 + bob;
  ctx.fillStyle = "#ffd36b";
  ctx.strokeStyle = "#3a2112";
  ctx.lineWidth = 3;
  ctx.beginPath();
  if (above) {
    ctx.moveTo(ax, ay + 12); ctx.lineTo(ax - 14, ay - 10); ctx.lineTo(ax + 14, ay - 10);
  } else {
    ctx.moveTo(ax, ay - 12); ctx.lineTo(ax - 14, ay + 10); ctx.lineTo(ax + 14, ay + 10);
  }
  ctx.closePath();
  ctx.fill();
  ctx.stroke();
}

    outlinedRound(420, 230, 440, 170, 20, "rgba(30,18,10,0.97)", 3, "#f2b134");

    drawText("تقدر ترجعله من الإعدادات في أي وقت", 640, 312, 15, "#bfe3f2");
  }
  const bs = tutorialButtons();
  for (let i = 0; i < bs.length; i++) {
    drawButton(bs[i].box, bs[i].label, bs[i].color, bs[i].textColor, game.hover === bs[i].name, bs[i].size);
  }
}

// في التدريب: بنسمح بس بالحركة المطلوبة في الخطوة (وبمرة واحدة)
function tutAllow(kind) {
  const T = game.tut;
  if (!T) {
    return true;
  }
  const st = TUT_STEPS[T.step];
  if (!st.allow && !st.info) {
    return true;
  }
  if (T.doneT >= 0) {
    return false;
  }
  if (st.allow && st.allow.indexOf(kind) >= 0 && T.used !== T.step) {
    T.used = T.step;
    return true;
  }
  if (T.used !== T.step) {
    showMessage("اتبع السهم الدهبي يا شيف", "#ffd36b");
  }
  return false;
}
